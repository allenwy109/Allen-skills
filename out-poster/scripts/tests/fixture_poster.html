<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星河数据科技 经营概览</title>
<style>
:root { --paper:#fbfaf7; --ink:#1b2a3a; --navy:#0b3c5d; --muted:#5b6b7b; --rule:#c9d1d9; }
* { box-sizing:border-box; margin:0; padding:0; }
body { width:1920px; height:1080px; background:var(--paper); color:var(--ink);
  font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",serif; overflow:hidden; }
.page { width:1920px; height:1080px; padding:72px 96px; display:grid;
  grid-template-rows: 200px 420px 220px 96px; align-content:start; row-gap:24px; }
.kicker { font-family:"JetBrains Mono",Menlo,monospace; font-size:14px; letter-spacing:2px; color:var(--muted); }
h1 { font-size:64px; line-height:1.25; margin-top:16px; }
.bignum-module { display:grid; grid-template-columns:repeat(3,1fr); column-gap:48px; border-top:2px solid var(--ink); padding-top:32px; }
.bignum-value { font-family:"JetBrains Mono",Menlo,monospace; font-size:120px; line-height:1; color:var(--navy); }
.bignum-label { font-size:22px; color:var(--muted); margin-top:16px; line-height:1.8; }
.body { font-size:24px; line-height:1.9; border-top:1px solid var(--rule); padding-top:24px; }
.footer { font-family:"JetBrains Mono",Menlo,monospace; font-size:13px; color:var(--muted); border-top:1px solid var(--rule); padding-top:16px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<div class="page">
  <header><p class="kicker">星河数据科技 · 经营概览</p><h1>收入两年增长近八成，规模仍小</h1></header>
  <section class="bignum-module">
    <div class="bignum-item"><div class="bignum-value">1800</div><p class="bignum-label">2024 年收入（万元）</p></div>
    <div class="bignum-item"><div class="bignum-value">3200</div><p class="bignum-label">2025 年收入（万元）</p></div>
    <div class="bignum-item"><div class="bignum-value">77.8%</div><p class="bignum-label">两年增长率</p></div>
  </section>
  <section class="body"><p>增长主要来自新客户。收入规模仍小，单一年报数据，尚未经审计复核。</p></section>
  <footer class="footer"><span>来源：星河数据科技 2025 年年报（M001）</span><span>署名：测试</span></footer>
</div>
</body>
</html>
